# QLoRA SFT config - fits a free Colab T4 (16 GB) or any 8 GB+ consumer GPU.
base_model: Qwen/Qwen2.5-1.5B-Instruct     # Apache-2.0, strong instruction following at 1.5B, 32k context
output_dir: finetune/outputs/maplemind-qwen25-1.5b-lora
data_dir: finetune/data
quantization: {load_in_4bit: true, bnb_4bit_quant_type: nf4, bnb_4bit_use_double_quant: true, compute_dtype: float16}
lora:
  r: 16                  # rank: enough capacity for format/behaviour changes, small adapter (~18M params)
  alpha: 32              # alpha/r = 2 scaling
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
train:
  epochs: 3
  learning_rate: 2.0e-4
  lr_scheduler: cosine
  warmup_ratio: 0.05
  per_device_batch_size: 4
  gradient_accumulation: 4          # effective batch 16
  max_seq_len: 1536                 # evidence (~900-1400 tok) + answer
  weight_decay: 0.0
  eval_every_steps: 10
  early_stopping_patience: 3        # on validation loss
  seed: 7
  loss_on: assistant_only           # prompt tokens masked with -100 so the model learns answers, not evidence
  gradient_checkpointing: true
