id: gad7
name: Generalized Anxiety Disorder-7
source: "Spitzer, Kroenke, Williams & Lowe (2006). No permission required to reproduce, translate, display or distribute."
stem: "Over the last 2 weeks, how often have you been bothered by the following problem?"
options: {0: "Not at all", 1: "Several days", 2: "More than half the days", 3: "Nearly every day"}
gate: {items: [0, 1], threshold: 3}            # GAD-2 >= 3 -> continue to full GAD-7 (Kroenke et al. 2010)
safety_items: []
bands: [[0, 4, minimal], [5, 9, mild], [10, 14, moderate], [15, 21, severe]]
positive_cutoff: 10
items:
  - Feeling nervous, anxious, or on edge
  - Not being able to stop or control worrying
  - Worrying too much about different things
  - Trouble relaxing
  - Being so restless that it is hard to sit still
  - Becoming easily annoyed or irritable
  - Feeling afraid, as if something awful might happen
